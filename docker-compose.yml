# Levanta la app como en producción (una sola réplica, datos en un volumen).
#
#   bun run fonts:setup                          # las fuentes viajan en el contexto de build
#   cp .env.docker.example .env.production      # y completa los valores
#   docker compose up --build -d
#
# Quién la usa: README.md §Docker. Para Cloudflare ver «Cloudflare Workers».
services:
  app:
    build: .
    image: qr-production-generator
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env.production
    environment:
      NODE_OPTIONS: --max-old-space-size=700   # ≈70 % del límite de memoria
    volumes:
      - qr-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  qr-data:
